name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip project
        run: unzip -q project.zip -d extracted

      - name: Find project folder
        run: |
          S=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          echo "Found: $S"
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ls
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: speedkey-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
